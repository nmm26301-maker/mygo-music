plugins { id 'com.android.application' }

def apkMinimumSdk = providers.gradleProperty('mygoApi33Upgrade').orNull == 'true' ? 33 : 23

android { namespace 'com.mygo.music'; compileSdk 35
    defaultConfig { applicationId 'com.mygo.music'; minSdk apkMinimumSdk; targetSdk 35; versionCode 105; versionName '5.55.0'; testInstrumentationRunner 'com.mygo.music.PluginInstrumentation' }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
}

dependencies { implementation "com.google.zxing:core:3.5.3" }
