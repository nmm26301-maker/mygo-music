plugins { id 'com.android.application' }

def apkMinimumSdk = providers.gradleProperty('mygoApi33Upgrade').orNull == 'true' ? 33 : 23
def parallelPreview = providers.gradleProperty('mygoParallelPreview').orNull == 'true'
def pluginScheme = parallelPreview ? 'mygo-music-preview' : 'mygo-music'

android { namespace 'com.mygo.music'; compileSdk 35
    defaultConfig {
        applicationId(parallelPreview ? 'com.mygo.music.preview' : 'com.mygo.music')
        minSdk apkMinimumSdk
        targetSdk 35
        versionCode 113
        versionName '5.63.0'
        testInstrumentationRunner 'com.mygo.music.PluginInstrumentation'
        manifestPlaceholders = [mygoLabel: parallelPreview ? 'MyGo Music 体验版' : 'MyGo Music']
        resValue 'string', 'plugin_link_scheme', pluginScheme
        if (parallelPreview) ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
}

dependencies { implementation "com.google.zxing:core:3.5.3" }
