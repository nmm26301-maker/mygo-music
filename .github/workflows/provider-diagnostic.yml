name: Read-only public provider diagnostic
on:
  push:
    branches: [codex/provider-diagnostic-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/probe-ximalaya-public.py
      - uses: actions/upload-artifact@v4
        with:
          name: ximalaya-public-probe
          path: ximalaya-public-probe.json
