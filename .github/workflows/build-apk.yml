name: Build MyGo Music APK
on:
  push:
    branches: [ main, codex/player-themes-20261115, codex/player-completion-20261115, codex/live-aac-20261116, codex/fmp4-aac-20261116, codex/hls-cache-20261117, codex/bilibili-mirrors-20261117, codex/bilibili-he-aac-20261117, codex/cache-consistency-20261118, codex/cache-management-20261118, codex/manual-cache-20261118, codex/decoded-cache-20261118, codex/lyric-alignment-20261118 ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android plugin launcher for all supported ABIs
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "ndk;27.2.12479018"
          TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for SPEC in "arm64-v8a:aarch64-linux-android" "armeabi-v7a:armv7a-linux-androideabi" "x86_64:x86_64-linux-android" "x86:i686-linux-android"; do
            ABI="${SPEC%%:*}"
            TARGET="${SPEC#*:}"
            mkdir -p "app/src/main/jniLibs/$ABI"
            "$TOOLCHAIN/${TARGET}23-clang" -O2 -fPIE -pie -Wl,-z,relro,-z,now,-z,max-page-size=16384 app/src/main/cpp/plugin-launcher.c -o "app/src/main/jniLibs/$ABI/libmygo-launcher.so"
          done
      - uses: actions/cache@v4
        id: native-audio-cache
        with:
          path: .native-audio-cache
          key: android-native-audio-${{ hashFiles('tests/build-native-audio.py') }}
      - name: Build pinned Android audio decoder and corresponding source archive
        run: python3 tests/build-native-audio.py
      - uses: actions/cache/save@v4
        if: steps.native-audio-cache.outputs.cache-hit != 'true'
        with:
          path: .native-audio-cache
          key: android-native-audio-${{ hashFiles('tests/build-native-audio.py') }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        id: plugin-tools-cache
        with:
          path: .plugin-tools-cache
          key: android-plugin-tools-${{ hashFiles('tests/build-plugin-tools.py', 'tests/native-tools-pins.json', 'app/src/main/cpp/plugin-python.c') }}
      - name: Build verified native plugin tools
        run: python3 tests/build-plugin-tools.py
      - uses: actions/cache/save@v4
        if: steps.plugin-tools-cache.outputs.cache-hit != 'true'
        with:
          path: .plugin-tools-cache
          key: android-plugin-tools-${{ hashFiles('tests/build-plugin-tools.py', 'tests/native-tools-pins.json', 'app/src/main/cpp/plugin-python.c') }}
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare verified offline TypeScript compiler
        run: python3 tests/prepare-typescript.py
      - name: Prepare pinned upstream market packages for tests
        run: python3 tests/prepare-market-audit.py
      - name: Prepare original provider and HLS fixtures
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 tests/prepare-port-fixtures.py
          python3 tests/prepare-live-aac.py
          python3 tests/prepare-provider-fixes.py
          python3 tests/prepare-bilibili-he.py
          python3 tests/prepare-cache-regression.py
          python3 tests/probe-ximalaya-public.py
          node tests/prepare-lyric-motion.cjs
          node --test tests/bilibili-playback.test.mjs tests/ximalaya-response.test.mjs tests/kugou-playback.test.mjs tests/qq-web-login.test.mjs tests/plugin-fetch-stream.test.mjs
      - name: Build Android runtime tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Execute actual WebView plugin tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell wm size 320x640
            adb shell wm density 160
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee plugin-test-results.txt
            adb logcat -d > android-logcat.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/main-stalls main-stalls || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/qq-official-login.png qq-official-login.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/login-repair login-repair || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/source-browser.png source-browser.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/recommended-covers.png recommended-covers.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyrics-stage.png lyrics-stage.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyrics-pop lyrics-pop || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-styles lyric-styles || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-motion lyric-motion || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-player lyric-player || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/now-playing now-playing || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/themes themes || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/theme-experience theme-experience || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/audio-analysis audio-analysis || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/audio-quality.png audio-quality.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/audio-experience.png audio-experience.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/web-qr-test.png web-qr-test.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/hls-cache hls-cache-controlled || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/bilibili-mirrors bilibili-mirrors-controlled || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/bilibili-he-aac bilibili-he-aac
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/ximalaya-response ximalaya-response
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/cache-consistency cache-consistency
            grep -F MYGO_TESTS_OK plugin-test-results.txt
            adb shell am instrument -w -e themeRestart prepare com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee theme-restart-prepare.txt
            grep -F MYGO_THEME_RESTART_PREPARED theme-restart-prepare.txt
            adb shell am force-stop com.mygo.music
            adb shell am instrument -w -e themeRestart verify com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee theme-restart-verify.txt
            grep -F MYGO_THEME_RESTART_VERIFIED theme-restart-verify.txt
            adb logcat -d > android-logcat.txt
            adb shell am instrument -w -e biliMirrorPublic true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee bilibili-mirrors-public-results.txt
            adb logcat -d > bilibili-mirrors-logcat.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/bilibili-mirrors bilibili-mirrors || true
            grep -F MYGO_BILIBILI_MIRRORS_PUBLIC_OK bilibili-mirrors-public-results.txt
            adb shell am instrument -w -e bilibiliTransport true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee bilibili-diagnostic.txt
            grep -F MYGO_BILIBILI_DIAGNOSTIC_OK bilibili-diagnostic.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/bilibili-transport bilibili-transport || true
            adb shell am instrument -w -e roamLive true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee roamdial-live-results.txt
            grep -F MYGO_ROAMDIAL_LIVE_OK roamdial-live-results.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/live-aac live-aac || true
            adb shell am instrument -w -e soundgoPlayback true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee soundgo-playback-results.txt
            grep -F MYGO_SOUNDGO_PUBLIC_OK soundgo-playback-results.txt
            grep -F MYGO_SOUNDGO_PLAYBACK_OK soundgo-playback-results.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/fmp4-aac fmp4-aac || true
            adb shell am instrument -w -e marketAudit true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee market-test-results.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/market-audit.json market-audit.json
            grep -F MYGO_MARKET_AUDIT_OK market-test-results.txt
            adb shell am instrument -w -e hlsCachePublic true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee soundgo-offline-results.txt
            adb logcat -d > hls-cache-logcat.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/hls-cache hls-cache || true
            grep -F MYGO_SOUNDGO_OFFLINE_OK soundgo-offline-results.txt
            adb shell am start -n com.mygo.music/.MainActivity
            adb shell input keyevent 82
            adb shell screencap -p /sdcard/landscape.png
            adb pull /sdcard/landscape.png landscape.png
