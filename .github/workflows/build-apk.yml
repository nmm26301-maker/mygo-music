name: Build MyGo Music APK
on:
  push:
    branches: [ main, codex/player-themes-20261115, codex/player-completion-20261115, codex/live-aac-20261116, codex/fmp4-aac-20261116, codex/hls-cache-20261117, codex/bilibili-mirrors-20261117, codex/bilibili-he-aac-20261117, codex/cache-consistency-20261118, codex/cache-management-20261118, codex/manual-cache-20261118, codex/decoded-cache-20261118, codex/offline-lyrics-20261118, codex/library-lyrics-20261118, codex/secure-release-20261119, codex/plugin-playback-check-20261119, codex/mygo-validation-20261119, codex/mygo-signing-playback-20261119*, codex/mygo-upgrade-library-20261119*, codex/mygo-installable-preview-* ]
  workflow_dispatch:
    inputs:
      fresh_install_release:
        description: Build with the new key for fresh installs
        type: boolean
        default: false
      android13_upgrade_release:
        description: Build an Android 13+ upgrade with the approved signing lineage
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android plugin launcher for all supported ABIs
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "ndk;27.2.12479018"
          TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for SPEC in "arm64-v8a:aarch64-linux-android" "armeabi-v7a:armv7a-linux-androideabi" "x86_64:x86_64-linux-android" "x86:i686-linux-android"; do
            ABI="${SPEC%%:*}"
            TARGET="${SPEC#*:}"
            mkdir -p "app/src/main/jniLibs/$ABI"
            "$TOOLCHAIN/${TARGET}23-clang" -O2 -fPIE -pie -Wl,-z,relro,-z,now,-z,max-page-size=16384 app/src/main/cpp/plugin-launcher.c -o "app/src/main/jniLibs/$ABI/libmygo-launcher.so"
          done
      - uses: actions/cache@v4
        id: native-audio-cache
        with:
          path: .native-audio-cache
          key: android-native-audio-${{ hashFiles('tests/build-native-audio.py') }}
      - name: Build pinned Android audio decoder and corresponding source archive
        run: python3 tests/build-native-audio.py
      - uses: actions/cache/save@v4
        if: steps.native-audio-cache.outputs.cache-hit != 'true'
        with:
          path: .native-audio-cache
          key: android-native-audio-${{ hashFiles('tests/build-native-audio.py') }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        id: plugin-tools-cache
        with:
          path: .plugin-tools-cache
          key: android-plugin-tools-${{ hashFiles('tests/build-plugin-tools.py', 'tests/native-tools-pins.json', 'app/src/main/cpp/plugin-python.c') }}
      - name: Build verified native plugin tools
        run: python3 tests/build-plugin-tools.py
      - uses: actions/cache/save@v4
        if: steps.plugin-tools-cache.outputs.cache-hit != 'true'
        with:
          path: .plugin-tools-cache
          key: android-plugin-tools-${{ hashFiles('tests/build-plugin-tools.py', 'tests/native-tools-pins.json', 'app/src/main/cpp/plugin-python.c') }}
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare verified offline TypeScript compiler
        run: python3 tests/prepare-typescript.py
      - name: Prepare pinned upstream market packages for tests
        run: python3 tests/prepare-market-audit.py
      - name: Assemble targeted Android tests from local fixtures
        run: |
          python3 tests/prepare-cache-regression.py
          gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Create disposable APKs to test signing-key rotation
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/mygo-sdk23-debug.apk"
          gradle --no-daemon -PmygoApi33Upgrade=true assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/mygo-sdk33-debug.apk"
          cp "$RUNNER_TEMP/mygo-sdk23-debug.apk" app/build/outputs/apk/debug/app-debug.apk
          bash tests/prepare-signing-rotation.sh "$RUNNER_TEMP/mygo-sdk33-debug.apk"
      - name: Verify selected plugin playback and signing rotation on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell wm size 320x640
            adb shell wm density 160
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e selectedPluginPlayback true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee selected-playback-results.txt
            adb logcat -d > selected-playback-logcat.txt
            grep -F MYGO_SELECTED_PLUGIN_PLAYBACK_OK selected-playback-results.txt
            adb uninstall com.mygo.music.test
            bash tests/verify-signing-rotation.sh | tee signing-rotation-results.txt
            grep -F MYGO_SIGNING_ROTATION_OK signing-rotation-results.txt
            adb uninstall com.mygo.music
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-android-security-results-${{ github.run_attempt }}
          path: |
            selected-playback-results.txt
            selected-playback-logcat.txt
            signing-rotation-results.txt
      - name: Prepare original provider and HLS fixtures
        timeout-minutes: 20
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i -E 's#http://([a-z0-9-]+[.])?ec2[.]archive[.]ubuntu[.]com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          python3 tests/prepare-port-fixtures.py
          python3 tests/prepare-live-aac.py
          python3 tests/prepare-provider-fixes.py
          python3 tests/prepare-bilibili-he.py
          python3 tests/prepare-cache-regression.py
          python3 tests/probe-ximalaya-public.py
          node tests/prepare-lyric-motion.cjs
          node --test tests/bilibili-playback.test.mjs tests/ximalaya-response.test.mjs tests/kugou-playback.test.mjs tests/qq-web-login.test.mjs tests/plugin-fetch-stream.test.mjs
      - name: Build Android runtime tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Execute actual WebView plugin tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell wm size 320x640
            adb shell wm density 160
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee plugin-test-results.txt
            adb logcat -d > android-logcat.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/main-stalls main-stalls || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/qq-official-login.png qq-official-login.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/login-repair login-repair || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/source-browser.png source-browser.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/recommended-covers.png recommended-covers.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyrics-stage.png lyrics-stage.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyrics-pop lyrics-pop || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-styles lyric-styles || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-motion lyric-motion || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-player lyric-player || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/now-playing now-playing || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/themes themes || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/theme-experience theme-experience || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/audio-analysis audio-analysis || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/audio-quality.png audio-quality.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/audio-experience.png audio-experience.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/web-qr-test.png web-qr-test.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/hls-cache hls-cache-controlled || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/bilibili-mirrors bilibili-mirrors-controlled || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/bilibili-he-aac bilibili-he-aac
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/ximalaya-response ximalaya-response
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/cache-consistency cache-consistency
            grep -F MYGO_TESTS_OK plugin-test-results.txt
            adb shell am instrument -w -e themeRestart prepare com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee theme-restart-prepare.txt
            grep -F MYGO_THEME_RESTART_PREPARED theme-restart-prepare.txt
            adb shell am force-stop com.mygo.music
            adb shell am instrument -w -e themeRestart verify com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee theme-restart-verify.txt
            grep -F MYGO_THEME_RESTART_VERIFIED theme-restart-verify.txt
            adb logcat -d > android-logcat.txt
            adb shell am instrument -w -e biliMirrorPublic true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee bilibili-mirrors-public-results.txt
            adb logcat -d > bilibili-mirrors-logcat.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/bilibili-mirrors bilibili-mirrors || true
            grep -F MYGO_BILIBILI_MIRRORS_PUBLIC_OK bilibili-mirrors-public-results.txt
            adb shell am instrument -w -e bilibiliTransport true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee bilibili-diagnostic.txt
            grep -F MYGO_BILIBILI_DIAGNOSTIC_OK bilibili-diagnostic.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/bilibili-transport bilibili-transport || true
            adb shell am instrument -w -e roamLive true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee roamdial-live-results.txt
            grep -F MYGO_ROAMDIAL_LIVE_OK roamdial-live-results.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/live-aac live-aac || true
            adb shell am instrument -w -e soundgoPlayback true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee soundgo-playback-results.txt
            grep -F MYGO_SOUNDGO_PUBLIC_OK soundgo-playback-results.txt
            grep -F MYGO_SOUNDGO_PLAYBACK_OK soundgo-playback-results.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/fmp4-aac fmp4-aac || true
            adb shell am instrument -w -e marketAudit true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee market-test-results.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/market-audit.json market-audit.json
            grep -F MYGO_MARKET_AUDIT_OK market-test-results.txt
            adb shell am instrument -w -e hlsCachePublic true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee soundgo-offline-results.txt
            adb logcat -d > hls-cache-logcat.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/hls-cache hls-cache || true
            grep -F MYGO_SOUNDGO_OFFLINE_OK soundgo-offline-results.txt
            adb shell am start -n com.mygo.music/.MainActivity
            adb shell input keyevent 82
            adb shell screencap -p /sdcard/landscape.png
            adb pull /sdcard/landscape.png landscape.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-plugin-test-results-${{ github.run_attempt }}
          path: |
            plugin-test-results.txt
            theme-restart-prepare.txt
            theme-restart-verify.txt
            android-logcat.txt
            main-stalls/
            market-test-results.txt
            market-audit.json
            roamdial-live-results.txt
            soundgo-offline-results.txt
            hls-cache-logcat.txt
            hls-cache/
            hls-cache-controlled/
            bilibili-mirrors/
            bilibili-mirrors-controlled/
            bilibili-he-aac/
            ximalaya-response/
            cache-consistency/
            app/src/androidTest/assets/cache-regression-proof.json
            ximalaya-public-probe.json
            app/src/androidTest/assets/port-fixtures/he-proof.json
            bilibili-mirrors-public-results.txt
            bilibili-mirrors-logcat.txt
            live-aac/
            soundgo-playback-results.txt
            fmp4-aac/
            bilibili-diagnostic.txt
            bilibili-transport/
            landscape.png
            lyrics-stage.png
            lyrics-pop/
            lyric-styles/
            lyric-motion/
            lyric-player/
            audio-quality.png
            now-playing/
            themes/
            theme-experience/
            audio-analysis/
            audio-experience.png
            web-qr-test.png
            source-browser.png
            recommended-covers.png
            qq-official-login.png
            login-repair/
            .native-audio-cache/*-lame.log
            .plugin-tools-cache/build.log
      - name: Include per-source Android check results in the release
        run: cp market-audit.json app/src/main/assets/plugin-audit.json
      - name: Build and sign the separate installable preview
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/mygo-installable-preview-') }}
        run: |
          gradle --no-daemon -PmygoParallelPreview=true assembleRelease
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          bash tests/sign-preview-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            "preview/mygo-music-v${version}-preview.apk"
      - name: Fetch the original 5.53.0 APK for the coexistence test
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/mygo-installable-preview-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44302811247 --name mygo-music-android-release --dir "$RUNNER_TEMP/mygo-baseline"
          cd "$RUNNER_TEMP/mygo-baseline"
          echo '191541167a0433cdacea969c20387cce87e75dc2833ca20d2274be29e59e2c5d  mygo-music-v5.53.0.apk' | sha256sum -c
      - name: Verify the signed preview installs alongside 5.53.0
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/mygo-installable-preview-') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          avd-name: mygo-preview-coexistence
          disable-animations: true
          script: bash tests/verify-preview-install.sh "$RUNNER_TEMP/mygo-baseline/mygo-music-v5.53.0.apk" preview/*.apk
      - name: Package the corresponding native sources for the preview
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/mygo-installable-preview-') }}
        run: |
          python3 tests/build-native-audio.py
          python3 tests/package-plugin-sources.py
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/mygo-installable-preview-') }}
        with:
          name: mygo-music-android-preview-apk
          path: preview/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/mygo-installable-preview-') }}
        with:
          name: mygo-music-android-preview-sources
          path: app/build/outputs/release/*-sources.zip
          if-no-files-found: error
      - name: Assemble unsigned release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.fresh_install_release || inputs.android13_upgrade_release) }}
        env:
          UPGRADE: ${{ inputs.android13_upgrade_release }}
          FRESH: ${{ inputs.fresh_install_release }}
        run: |
          if [[ "$UPGRADE" == true && "$FRESH" == true ]]; then
            echo 'Select exactly one production release type.' >&2
            exit 1
          fi
          gradle --no-daemon -PmygoApi33Upgrade="$UPGRADE" assembleRelease
      - name: Refresh corresponding sources with the final source audit
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.fresh_install_release || inputs.android13_upgrade_release) }}
        run: python3 tests/build-native-audio.py
      - name: Include exact native plugin sources and licenses
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.fresh_install_release || inputs.android13_upgrade_release) }}
        run: python3 tests/package-plugin-sources.py
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.fresh_install_release || inputs.android13_upgrade_release) }}
        with:
          name: mygo-music-unsigned-release-input
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/release/*-sources.zip
          if-no-files-found: error

  sign-production:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.fresh_install_release || inputs.android13_upgrade_release) }}
    needs: build
    runs-on: ubuntu-latest
    environment: android-release
    env:
      RELEASE_MODE: ${{ inputs.android13_upgrade_release && 'android13-upgrade' || 'fresh-install' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mygo-music-unsigned-release-input
          path: unsigned-input
      - name: Install APK signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Sign with the protected production key
        env:
          MYGO_RELEASE_KEYSTORE_B64: ${{ secrets.MYGO_RELEASE_KEYSTORE_B64 }}
          MYGO_RELEASE_STORE_PASSWORD: ${{ secrets.MYGO_RELEASE_STORE_PASSWORD }}
          MYGO_RELEASE_KEY_PASSWORD: ${{ secrets.MYGO_RELEASE_KEY_PASSWORD }}
          MYGO_RELEASE_KEY_ALIAS: ${{ vars.MYGO_RELEASE_KEY_ALIAS }}
          MYGO_RELEASE_CERT_SHA256: ${{ vars.MYGO_RELEASE_CERT_SHA256 }}
          MYGO_RELEASE_LINEAGE_B64: ${{ secrets.MYGO_RELEASE_LINEAGE_B64 }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          APK="release/mygo-music-v${VERSION}-$RELEASE_MODE.apk"
          bash tests/sign-release.sh unsigned-input/apk/release/app-release-unsigned.apk "$APK" "$RELEASE_MODE"
          zip -j "${APK%.apk}-backup.zip" "$APK"
          cp unsigned-input/release/*-sources.zip release/
      - name: Fetch and verify the delivered 5.53.0 baseline
        if: ${{ inputs.android13_upgrade_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44302811247 --name mygo-music-android-release --dir "$RUNNER_TEMP/mygo-baseline"
          cd "$RUNNER_TEMP/mygo-baseline"
          echo '191541167a0433cdacea969c20387cce87e75dc2833ca20d2274be29e59e2c5d  mygo-music-v5.53.0.apk' | sha256sum -c
      - name: Enable KVM for the release verification emulator
        if: ${{ inputs.android13_upgrade_release }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test coverage and data preservation from the delivered APK
        if: ${{ inputs.android13_upgrade_release }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/verify-upgrade-data.sh "$RUNNER_TEMP/mygo-baseline/mygo-music-v5.53.0.apk" release/*-android13-upgrade.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-music-android-${{ env.RELEASE_MODE }}-release
          path: release/*
          if-no-files-found: error
