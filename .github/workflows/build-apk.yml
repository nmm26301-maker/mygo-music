name: Build MyGo Music APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android plugin launcher for all supported ABIs
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "ndk;27.2.12479018"
          TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for SPEC in "arm64-v8a:aarch64-linux-android" "armeabi-v7a:armv7a-linux-androideabi" "x86_64:x86_64-linux-android" "x86:i686-linux-android"; do
            ABI="${SPEC%%:*}"
            TARGET="${SPEC#*:}"
            mkdir -p "app/src/main/jniLibs/$ABI"
            "$TOOLCHAIN/${TARGET}23-clang" -O2 -fPIE -pie -Wl,-z,relro,-z,now,-z,max-page-size=16384 app/src/main/cpp/plugin-launcher.c -o "app/src/main/jniLibs/$ABI/libmygo-launcher.so"
          done
      - uses: actions/cache@v4
        id: native-audio-cache
        with:
          path: .native-audio-cache
          key: android-native-audio-${{ hashFiles('tests/build-native-audio.py') }}
      - name: Build pinned Android audio decoder and corresponding source archive
        run: python3 tests/build-native-audio.py
      - uses: actions/cache/save@v4
        if: steps.native-audio-cache.outputs.cache-hit != 'true'
        with:
          path: .native-audio-cache
          key: android-native-audio-${{ hashFiles('tests/build-native-audio.py') }}
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare verified offline TypeScript compiler
        run: python3 tests/prepare-typescript.py
      - name: Prepare pinned upstream market packages for tests
        run: python3 tests/prepare-market-audit.py
      - name: Prepare original provider and HLS fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 tests/prepare-port-fixtures.py
          python3 tests/prepare-provider-fixes.py
          node tests/prepare-lyric-motion.cjs
          node --test tests/kugou-playback.test.mjs tests/qq-web-login.test.mjs tests/plugin-fetch-stream.test.mjs
      - name: Build Android runtime tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Execute actual WebView plugin tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee plugin-test-results.txt
            adb logcat -d > android-logcat.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/qq-official-login.png qq-official-login.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/login-repair login-repair || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/source-browser.png source-browser.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/recommended-covers.png recommended-covers.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyrics-stage.png lyrics-stage.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyrics-pop lyrics-pop || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-styles lyric-styles || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-motion lyric-motion || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/lyric-player lyric-player || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/audio-quality.png audio-quality.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/audio-experience.png audio-experience.png || true
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/web-qr-test.png web-qr-test.png || true
            grep -F MYGO_TESTS_OK plugin-test-results.txt
            adb shell am instrument -w -e marketAudit true com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee market-test-results.txt
            adb pull /sdcard/Android/data/com.mygo.music/files/qa/market-audit.json market-audit.json
            grep -F MYGO_MARKET_AUDIT_OK market-test-results.txt
            adb shell am start -n com.mygo.music/.MainActivity
            adb shell input keyevent 82
            adb shell screencap -p /sdcard/landscape.png
            adb pull /sdcard/landscape.png landscape.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-plugin-test-results
          path: |
            plugin-test-results.txt
            android-logcat.txt
            market-test-results.txt
            market-audit.json
            landscape.png
            lyrics-stage.png
            lyrics-pop/
            lyric-styles/
            lyric-motion/
            lyric-player/
            audio-quality.png
            audio-experience.png
            web-qr-test.png
            source-browser.png
            recommended-covers.png
            qq-official-login.png
            login-repair/
      - name: Include per-source Android check results in the release
        run: cp market-audit.json app/src/main/assets/plugin-audit.json
      - name: Decode stable release signing key
        run: |
          test -s signing/mygo-release.keystore.b64
          base64 -d signing/mygo-release.keystore.b64 > signing/mygo-release.keystore
      - name: Build signed release APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          gradle --no-daemon assembleRelease
      - name: Verify APK integrity and stable signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          keytool -printcert -jarfile "$APK" | grep -F "AC:76:D9:1E:E0:8F:81:53:76:44:50:24:49:4B:FB:D7:23:A3:E5:9C:BB:20:A1:40:26:DA:97:F6:64:7D:B7:5A"
      - name: Download previously delivered signed v5.28.0 for upgrade verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43566612012 --name mygo-music-android-release --dir tests/baseline-v528
      - name: Verify upgrades from signed v5.6.0 and v5.28.0 on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb uninstall com.mygo.music || true
            adb install tests/baseline-v5.6.apk
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell dumpsys package com.mygo.music | grep 'versionCode=79'
            adb shell am start -W -n com.mygo.music/.MainActivity
            adb uninstall com.mygo.music
            adb install tests/baseline-v528/mygo-music-v5.28.0.apk
            adb shell am start -W -n com.mygo.music/.MainActivity
            adb shell am force-stop com.mygo.music
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell dumpsys package com.mygo.music | grep 'versionCode=79'
            adb shell am start -W -n com.mygo.music/.MainActivity
      - name: Prepare direct install files
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          mkdir -p app/build/outputs/release
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/release/mygo-music-v${VERSION}.apk"
          (cd app/build/outputs/apk/release && zip -j "../../release/mygo-music-android-v${VERSION}-install.zip" app-release.apk)
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-music-android-release
          path: app/build/outputs/release/*
