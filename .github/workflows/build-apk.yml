name: Build MyGo Music APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build Android runtime tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Execute actual WebView plugin tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.mygo.music.test/com.mygo.music.PluginInstrumentation | tee plugin-test-results.txt
            adb logcat -d > android-logcat.txt
            grep -F MYGO_TESTS_OK plugin-test-results.txt
            adb shell am start -n com.mygo.music/.MainActivity
            adb shell input keyevent 82
            adb shell screencap -p /sdcard/landscape.png
            adb pull /sdcard/landscape.png landscape.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-plugin-test-results
          path: |
            plugin-test-results.txt
            android-logcat.txt
            landscape.png
      - name: Decode stable release signing key
        run: |
          test -s signing/mygo-release.keystore.b64
          base64 -d signing/mygo-release.keystore.b64 > signing/mygo-release.keystore
      - name: Build signed release APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          gradle --no-daemon assembleRelease
      - name: Verify APK integrity and stable signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          keytool -printcert -jarfile "$APK" | grep -F "AC:76:D9:1E:E0:8F:81:53:76:44:50:24:49:4B:FB:D7:23:A3:E5:9C:BB:20:A1:40:26:DA:97:F6:64:7D:B7:5A"
      - name: Verify upgrade from signed v5.1.0 on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb uninstall com.mygo.music || true
            adb install tests/baseline-v5.1.apk
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell dumpsys package com.mygo.music | grep 'versionCode=52'
            adb shell am start -W -n com.mygo.music/.MainActivity
      - name: Prepare direct install files
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          mkdir -p app/build/outputs/release
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/release/mygo-music-v${VERSION}.apk"
          (cd app/build/outputs/apk/release && zip -j "../../release/mygo-music-android-v${VERSION}-install.zip" app-release.apk)
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-music-android-release
          path: app/build/outputs/release/*
