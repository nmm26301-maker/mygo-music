name: Build MyGo Music APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode stable release signing key
        run: echo "$(cat signing/mygo-release.keystore.b64)" | base64 -d > signing/mygo-release.keystore
      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-music-android-release
          path: app/build/outputs/apk/release/app-release.apk
