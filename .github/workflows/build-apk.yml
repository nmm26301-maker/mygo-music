      - name: Include per-source Android check results in the release
        run: cp market-audit.json app/src/main/assets/plugin-audit.json
      - name: Decode stable release signing key
        run: |
          test -s signing/mygo-release.keystore.b64
          base64 -d signing/mygo-release.keystore.b64 > signing/mygo-release.keystore
      - name: Build signed release APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          gradle --no-daemon assembleRelease
      - name: Verify APK integrity and stable signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          keytool -printcert -jarfile "$APK" | grep -F "AC:76:D9:1E:E0:8F:81:53:76:44:50:24:49:4B:FB:D7:23:A3:E5:9C:BB:20:A1:40:26:DA:97:F6:64:7D:B7:5A"
      - name: Download previously delivered signed v5.35.0 for upgrade verification
