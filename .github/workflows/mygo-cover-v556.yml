name: Build and verify MyGo 5.56 Android 13 cover
on:
  push:
    branches: [ codex/mygo-cover-556-verify ]
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android plugin launcher for all supported ABIs
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "ndk;27.2.12479018"
          TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for SPEC in "arm64-v8a:aarch64-linux-android" "armeabi-v7a:armv7a-linux-androideabi" "x86_64:x86_64-linux-android" "x86:i686-linux-android"; do
            ABI="${SPEC%%:*}"
            TARGET="${SPEC#*:}"
            mkdir -p "app/src/main/jniLibs/$ABI"
            "$TOOLCHAIN/${TARGET}23-clang" -O2 -fPIE -pie -Wl,-z,relro,-z,now,-z,max-page-size=16384 app/src/main/cpp/plugin-launcher.c -o "app/src/main/jniLibs/$ABI/libmygo-launcher.so"
          done
      - uses: actions/cache@v4
        id: native-audio-cache
        with:
          path: .native-audio-cache
          key: android-native-audio-${{ hashFiles('tests/build-native-audio.py') }}
      - name: Build pinned Android audio decoder and corresponding source archive
        run: python3 tests/build-native-audio.py
      - uses: actions/cache/save@v4
        if: steps.native-audio-cache.outputs.cache-hit != 'true'
        with:
          path: .native-audio-cache
          key: android-native-audio-${{ hashFiles('tests/build-native-audio.py') }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        id: plugin-tools-cache
        with:
          path: .plugin-tools-cache
          key: android-plugin-tools-${{ hashFiles('tests/build-plugin-tools.py', 'tests/native-tools-pins.json', 'app/src/main/cpp/plugin-python.c') }}
      - name: Build verified native plugin tools
        run: python3 tests/build-plugin-tools.py
      - uses: actions/cache/save@v4
        if: steps.plugin-tools-cache.outputs.cache-hit != 'true'
        with:
          path: .plugin-tools-cache
          key: android-plugin-tools-${{ hashFiles('tests/build-plugin-tools.py', 'tests/native-tools-pins.json', 'app/src/main/cpp/plugin-python.c') }}
      - name: Restore the audit produced by the tested application commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 44669475053 --json headSha,conclusion --jq '.headSha + ":" + .conclusion')" = e97c2f9966dd6d0f8f5e82c0732eaab94231287a:success
          gh run download 44669475053 --name android-plugin-test-results-1 --dir "$RUNNER_TEMP/mygo-audit"
          python3 -m json.tool "$RUNNER_TEMP/mygo-audit/market-audit.json" >/dev/null
          cp "$RUNNER_TEMP/mygo-audit/market-audit.json" app/src/main/assets/plugin-audit.json
      - name: Build original-package Android 13 APK
        run: |
          gradle --no-daemon -PmygoApi33Upgrade=true assembleRelease
          python3 tests/build-native-audio.py
          python3 tests/package-plugin-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: android13-cover-unsigned-input
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: android13-cover-corresponding-sources
          path: app/build/outputs/release/*-sources.zip
          if-no-files-found: error
  sign-and-verify:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with:
          name: android13-cover-unsigned-input
          path: unsigned-input
      - name: Install signing tools and download the delivered APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          gh run download 44302811247 --name mygo-music-android-release --dir "$RUNNER_TEMP/mygo-baseline"
