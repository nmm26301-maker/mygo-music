          2VdoRexK62m8h99eq9d2+oXLogaN6LfLUYdg2opG8CPopBTwAA==
          -----END CERTIFICATE-----
          MYGO_PUBLIC_RECIPIENT
          bash tests/sign-v556-cover-once.sh unsigned-input/app-release-unsigned.apk \
            "$RUNNER_TEMP/mygo-baseline/mygo-music-v5.53.0.apk" "$RUNNER_TEMP/mygo-recipient.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-cover-sealed-signing-transfer
          path: sealed/mygo-release-signing.cms
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM for Android 13 verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real in-place upgrade from the delivered 5.53.0 APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash tests/verify-upgrade-data.sh "$RUNNER_TEMP/mygo-baseline/mygo-music-v5.53.0.apk" cover/mygo-music-v5.56.0-android13-cover.apk
            adb shell dumpsys package com.mygo.music | grep -F 'versionName=5.56.0'
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-music-android13-cover-v5.56.0
          path: cover/mygo-music-v5.56.0-android13-cover.apk
          if-no-files-found: error
